# Validation only: no publication tasks, service connections, or release credentials.
trigger:
  - main
pr:
  - main

strategy:
  matrix:
    macOS:
      image: macOS-latest
    Linux:
      image: ubuntu-latest

pool:
  vmImage: $(image)

steps:
  - checkout: self
  - task: NodeTool@0
    displayName: Use repository Node.js 24
    inputs:
      versionSpec: 24.x
  - script: npm ci
    displayName: Install locked dependencies
  - script: npm run check
    displayName: Validate sources, audits, native workflows, and package inventory
  - script: |
      status=0
      npm run check:visual || status=$?
      if [[ -f dev/.cache/visual/report/index.html ]]; then
        echo "##vso[task.setvariable variable=VisualReportAvailable]true"
      fi
      exit "$status"
    displayName: Check published theme screenshots in pinned Linux VS Code
    condition: and(succeeded(), eq(variables['image'], 'ubuntu-latest'))
  - task: PublishPipelineArtifact@1
    displayName: Upload visual comparison report
    condition: and(succeededOrFailed(), eq(variables['VisualReportAvailable'], 'true'))
    inputs:
      targetPath: dev/.cache/visual/report
      artifact: visual-comparisons
